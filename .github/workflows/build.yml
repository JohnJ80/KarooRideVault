name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GPR_TOKEN }}
        run: ./gradlew assembleRelease
        # Strava credentials are injected via gradle.properties or secrets

      - name: Generate manifest.json
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
          cat > manifest.json << EOF
          {
            "packageName": "com.ridevault.karoo",
            "latestVersion": "$VERSION_NAME",
            "latestVersionCode": $VERSION_CODE,
            "apkUrl": "https://github.com/JohnJ80/KarooRideVault/releases/download/${{ github.ref_name }}/KarooRideVault-$VERSION_NAME.apk"
          }
          EOF

      - name: Rename APK
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk KarooRideVault-$VERSION_NAME.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KarooRideVault-*.apk
            manifest.json
          generate_release_notes: true
